
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductVault Dashboard</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .dashboard-header {
      background: #ffffff;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .dashboard-header h1 {
      margin: 0;
      color: #2563eb;
      font-size: 26px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #add-product {
      background: #2563eb;
      color: white;
    }

    #logout {
      background: #dc2626;
      color: white;
    }

    .dashboard-container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 5%;
    }

    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background: #ffffff;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    .toolbar select {
      min-width: 180px;
    }

    #status {
      margin: 15px 0 22px;
      color: #475569;
      font-size: 15px;
    }

    /* Three columns: each six-product batch fills two rows. */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .product-card img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .product-card h3 {
      font-size: 21px;
      margin: 0 0 16px;
      overflow-wrap: anywhere;
    }

    .product-card p {
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .product-card .price {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      margin-top: 8px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      padding-top: 20px;
    }

    .card-actions button {
      width: 100%;
      min-height: 48px;
      color: white;
      font-size: 17px;
    }

    .card-actions button:not(.danger) {
      background: #2563eb;
    }

    .card-actions button.danger {
      background: #dc2626;
    }

    #product-form {
      display: none;
      background: #ffffff;
      border-radius: 14px;
      padding: 25px;
      margin: 0 0 28px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    }

    #product-form h2 {
      margin-top: 0;
    }

    #product-editor {
      display: grid;
      gap: 14px;
    }

    #product-editor input,
    #product-editor textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    #product-editor textarea {
      resize: vertical;
      min-height: 90px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #save-product {
      background: #2563eb;
      color: white;
    }

    #cancel-form {
      background: #64748b;
      color: white;
    }

    #form-error {
      color: #dc2626;
      font-weight: bold;
    }

    /* Tablet: two columns. */
    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .dashboard-container {
        padding: 22px 4%;
      }

      .product-card {
        padding: 18px;
      }
    }

    /* Mobile: one column. */
    @media (max-width: 520px) {
      .dashboard-header {
        padding: 15px;
        align-items: flex-start;
        flex-direction: column;
      }

      .dashboard-header h1 {
        font-size: 23px;
      }

      .product-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <header class="dashboard-header">
    <h1>ProductVault</h1>

    <div class="header-actions">
      <button id="add-product" type="button">+ Add Product</button>
      <button id="logout" type="button">Logout</button>
    </div>
  </header>

  <main class="dashboard-container">
    <section class="toolbar">
      <input
        type="search"
        id="search"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <select id="sort" aria-label="Sort products">
        <option value="newest">Newest First</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </section>

    <section id="product-form">
      <h2 id="form-title">Add Product</h2>

      <form id="product-editor">
        <input
          type="text"
          id="product-name"
          placeholder="Product name"
          maxlength="200"
          required
        >

        <textarea
          id="product-description"
          placeholder="Product description"
        ></textarea>

        <input
          type="number"
          id="product-price"
          placeholder="Product price"
          min="0"
          step="0.01"
          required
        >

        <p id="form-error" role="alert"></p>

        <div class="form-actions">
          <button type="submit" id="save-product">Save Product</button>
          <button type="button" id="cancel-form">Cancel</button>
        </div>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading products...
    </p>

    <section
      id="products"
      class="product-grid"
      aria-label="Products"
    ></section>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
