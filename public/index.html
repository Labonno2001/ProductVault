
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductVault | Login</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-card {
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
      text-align: left;
    }

    .login-card h1 {
      color: #2563eb;
      text-align: center;
      margin: 0 0 10px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin: 0 0 28px;
    }

    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #loginForm label {
      font-weight: bold;
      font-size: 14px;
    }

    #loginForm input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 8px;
    }

    #loginButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginButton:hover {
      background: #1d4ed8;
    }

    #loginButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message,
    #tokenMessage {
      font-size: 14px;
      overflow-wrap: anywhere;
      text-align: center;
      margin: 4px 0;
    }

    #collectTokenButton {
      display: none;
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #collectTokenButton:hover {
      background: #15803d;
    }

    #tokenMessage {
      color: #15803d;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-wrapper">
    <section class="login-card">
      <h1>ProductVault</h1>
      <p class="subtitle">Your products, organized.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">Login</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <button type="button" id="collectTokenButton">
      Collect Token
    </button>

    <p id="tokenMessage" role="status" aria-live="polite"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
